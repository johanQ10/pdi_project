<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo WebGPU</title>
    <link rel="stylesheet" href="style.css">
    <script src="action.js"></script>
</head>
<body>
    <button class="hamburger" id="hamburger-btn" aria-label="Abrir menú">
        <span>Hola</span>
    </button>

    <div class="layout-3col">
        <aside class="sidebar" id="sidebar">
            <nav>
                <a href="#" id="menu-info"><b>Información</b></a>
                <a href="#" id="menu-erosion"><b>Erosión</b></a>
                <a href="#" id="menu-dilatation"><b>Dilatación</b></a>
                <a href="#" id="menu-grayscale"><b>Escala de Grises</b></a>
                <a href="#"><span id="menu-colorscale"><b>Escala de Color</b></span><input type="color" id="color-picker" value="#ff0000"></a>
                <a href="#" id="menu-negative"><b>Negativo</b></a>
                <a href="#"><span id="menu-brightness"><b>Brillo</b></span><input type="number" id="brightness-input" class="input-style" value="0" step="0.1" min="-1.0" max="1.0"></a>
                <a href="#"><span id="menu-contrast"><b>Contraste</b></span><input type="number" id="contrast-input" class="input-style" value="1" step="0.1" min="0.0" max="10.0"></a>
                <a href="#"><span id="menu-zoom-prox"><b>Zoom Proximo</b></span><input type="number" id="zoom-prox-input" class="input-style" value="1" step="0.1" min="0.0" max="10.0"></a>
                <a href="#"><span id="menu-zoom-bilineal"><b>Zoom Bilineal</b></span><input type="number" id="zoom-bilineal-input" class="input-style" value="1" step="0.1" min="0.0" max="10.0"></a>
                <a href="#"><span id="menu-gamma"><b>Gamma</b></span><input type="number" id="gamma-input" class="input-style" value="1" step="0.1" min="0.0" max="5.0"></a>
                <a href="#">
                    <b>Umbralizar</b>
                    <span>
                        <button id="umbral-simple-btn" type="button" class="menu-btn" style="margin-top: 5px;">S</button>
                        <button id="umbral-multiple-btn" type="button" class="menu-btn">M</button>
                    </span>
                </a>
                <a href="#" id="menu-flip">
                    <b>Flip</b>
                    <span>
                        <button id="flip-horizontal-btn" type="button" class="menu-btn">Hor.</button>
                        <button id="flip-vertical-btn" type="button" class="menu-btn">Ver.</button>
                    </span>
                </a>
                <a href="#">
                    <b>Rotar</b>
                    <input type="number" id="rotate-input" class="input-style" value="1" step="0.1" min="0.0" max="5.0">
                    <span>
                        <button id="rotate-btn" type="button" class="menu-btn" style="margin-top: 5px;">Go</button>
                        <br>
                        <button id="rotate-left-btn" type="button" class="menu-btn" style="margin-top: 5px;">-90°</button>
                        <button id="rotate-right-btn" type="button" class="menu-btn">90°</button>
                    </span>
                </a>
            </nav>
        </aside>
        <div class="main-content">
            <div>
                <div style="margin-bottom: 20px; text-align: center;">
                    <label for="image-load" class="image-upload-label">
                        Load image
                        <input type="file" id="image-load" accept="image/*" style="display:none;">
                    </label>
                </div>
                <canvas id="gpu-canvas" width="0px" height="0px" style="display: none;"></canvas>
            </div>
        </div>
        <aside class="rightbar">
            <div class="right-title-canvas" style="margin-top: 10px;">
                <strong>Curva Tonal</strong>
            </div>
            <canvas id="tonal-curve-canvas" class="right-canvas" width="256" height="256"></canvas>
            <div class="right-title-canvas">
                <strong>Histograma RGB</strong>
            </div>
            <canvas id="histogram-rgb-canvas" class="right-canvas" width="256" height="256"></canvas>
            <div class="right-title-canvas">
                <strong>Histograma R</strong>
            </div>
            <canvas id="histogram-r-canvas" class="right-canvas" width="256" height="256"></canvas>
            <div class="right-title-canvas">
                <strong>Histograma G</strong>
            </div>
            <canvas id="histogram-g-canvas" class="right-canvas" width="256" height="256"></canvas>
            <div class="right-title-canvas">
                <strong>Histograma B</strong>
            </div>
            <canvas id="histogram-b-canvas" class="right-canvas" width="256" height="256"></canvas>
        </aside>
    </div>
</body>
</html>
